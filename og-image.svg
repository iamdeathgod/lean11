  <!-- Background: ink ground with radial wash -->
  <defs>
    <radialGradient id="inkWash" cx="12%" cy="-8%" r="62%">
      <stop offset="0%" stop-color="#4078AA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A1D2E" stop-opacity="0"/>
    </radialGradient>
    <filter id="paperTexture" x="0" y="0" width="140" height="140" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" opacity="0.05"/>
    </filter>
  </defs>

  <!-- Full ink background -->
  <rect width="1200" height="630" fill="#0A1D2E"/>
  <rect width="1200" height="630" fill="url(#inkWash)"/>

